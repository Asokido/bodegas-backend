spring.application.name=bodegas-backend
server.port=8080

# Base de datos H2 en memoria (se reinicia cada vez que arranca la aplicación)
spring.datasource.url=jdbc:h2:mem:bodegasdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
